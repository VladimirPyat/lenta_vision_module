version: '3.8'

services:
  # 1. Сервер локальной LLM (CPU-версия)
  llm_server:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    ports:
      - "8000:8000"
    volumes:
      # Прокидываем локальную папку bin в /app/models внутри контейнера
      - ./vision/cpp_llm/bin:/app/models
    environment:
      - MODEL=/app/models/ZwZ-8B-Q6_K.gguf
      - CLIP_MODEL_PATH=/app/models/ZwZ-8B.mmproj-Q8_0.gguf
      - CHAT_FORMAT=qwen2.5-vl
      - MODEL_ALIAS=price-tag-vlm
      - N_CTX=4096
      - N_GPU_LAYERS=0
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped

  # 2. Наш Оркестратор и Web-API
  api_server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Синхронизируем папки для видео и результатов с хост-машиной
      - ./_download:/work/lenta_cv/_download
      - ./_output:/work/lenta_cv/_output
    environment:
      - LLM_BASE_URL=http://llm_server:8000/v1
    depends_on:
      - llm_server
    restart: unless-stopped